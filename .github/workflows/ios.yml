name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Repositoriy ko'chirilmoqda
        uses: actions/checkout@v4

      - name: Xcode versiyasi sozlanmoqda
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Swift kodini yig'ish va Payload yaratish
        run: |
          mkdir -p Payload
          
          # Swift fayllarini arm64 iOS uchun kompilyatsiya qilish
          swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
                 -target arm64-apple-ios15.0 \
                 -emit-executable \
                 CarrozzeriaApp.swift ContentView.swift \
                 -o Payload/Carrozzeria

          # Info.plist faylini yaratish
          cat <<EOF > Payload/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Carrozzeria</string>
              <key>CFBundleIdentifier</key>
              <string>com.user.carrozzeria</string>
              <key>CFBundleName</key>
              <string>Carrozzeria</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # IPA paketini shakllantirish
          mkdir -p AppPayload/Payload
          mv Payload AppPayload/Payload/Carrozzeria.app
          cd AppPayload
          zip -r ../Carrozzeria.ipa Payload

      - name: IPA faylini yuklash
        uses: actions/upload-artifact@v4
        with:
          name: Carrozzeria-Unsigned-IPA
          path: Carrozzeria.ipa
