name: Swift Linux Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Swift on Linux
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: "5.9"

    - name: Check Swift Version
      run: swift --version

    - name: Build / Test check
      run: swift build || swiftc ContentView.swift
